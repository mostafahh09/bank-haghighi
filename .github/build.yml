name: Build Bank Haghighi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          mkdir -p output
          echo "Bank Haghighi build started"
          zip -r output/bank-haghighi.zip index.html

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-haghighi
          path: output/bank-haghighi.zip
